name = "lok-computer-worker"
main = "worker.js"
compatibility_date = "2025-05-15"
account_id = "50d0c53b7190ef6df5c5083b25de689f"

# Development environment variables
[vars]
JEV_MODEL = "jev-latest"
# Ask AI question planner on AI_BASE_URL (HyprLab). Required.
JEV_PLANNER_MODEL = "gpt-6-luna"
FEDI_INSTANCE = "https://rex.cat"

# Ask AI spends planner and Jev credits; 20 calls per minute per client IP
# (one Ask is two calls). Wrangler 4.15 configures rate limiters as unsafe bindings.
[[unsafe.bindings]]
name = "JEV_RATE_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 20, period = 60 }
