name = "lok-computer-worker"
main = "worker/worker.js"
compatibility_date = "2025-05-15"
# No account_id: wrangler uses the logged-in account, or CLOUDFLARE_ACCOUNT_ID when
# the login can reach several.

# Development environment variables
[vars]
JEV_MODEL = "jev-latest"
# Ask AI question planner on AI_BASE_URL (HyprLab). Required.
JEV_PLANNER_MODEL = "gpt-6-luna"
FEDI_INSTANCE = "https://rex.cat"
NEODB_USERNAME = "lok"

# Ask AI spends planner and Jev credits; 20 calls per minute per client IP
# (one Ask is two calls). Wrangler 4.15 configures rate limiters as unsafe bindings.
[[unsafe.bindings]]
name = "JEV_RATE_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 20, period = 60 }

# The Fedi and NeoDB proxies spend a personal token's API quota; 60 requests
# per minute per client IP (the desktop's feeds and shelf use a handful).
[[unsafe.bindings]]
name = "PROXY_RATE_LIMITER"
type = "ratelimit"
namespace_id = "1002"
simple = { limit = 60, period = 60 }
