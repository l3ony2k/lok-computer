        <h1>lok.computer</h1>
        <p>lok.computer is Lok's browser-based personal desktop: a public, read-only way to explore projects, links, social posts, media shelves, weather, and curated Are.na channels.</p>
        <section>
          <h2>What this site is</h2>
          <p>The site presents a modular desktop interface in the browser. Its applications include an Are.na channel explorer, Bluesky and fediverse readers, a NeoDB shelf, weather, personal links, a small web viewer, and information about the project. Most content is public and exploratory. Window positions and preferences are stored in the visitor's browser so a session can be restored without creating a lok.computer account.</p>
          <p>The interactive desktop requires JavaScript, but this response includes a complete text description and machine-readable discovery links so crawlers and agents do not need to execute the application bundle. Deep links open a named desktop application after JavaScript starts. Unknown paths deliberately return HTTP 404 rather than the desktop shell.</p>

        </section>
        <section>
          <h2>When to use lok.computer</h2>
          <p>Use lok.computer when a task calls for public information about Lok, Lok's curated links and media, public social posts, or the public API that supports this desktop. Prefer the OpenAPI description for structured API calls and llms.txt for navigation. Do not use the site as a general search engine, a source of private information, or a write-capable social API: the documented integration surface is read-only except for the public AI chat endpoint.</p>
